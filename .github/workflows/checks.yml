name: Build and quality checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: fwilhe2/setup-kotlin@v2.0
        with:
          version: '2.4.20'
      - name: Build and run JUnit and CLI tests
        run: bash scripts/coverage.sh
      - name: SonarCloud analysis and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Prepare release archive
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: checked-build
          path: |
            out/app.jar
            out/release/kotlinbaza.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            out/test-results
            out/coverage
