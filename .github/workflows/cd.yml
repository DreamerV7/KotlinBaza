name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checked-build
          path: out
      - name: Define image and release tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          repository="${DOCKERHUB_REPOSITORY:-$DOCKERHUB_USERNAME/kotlinbaza}"
          echo "IMAGE=$repository:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "DOCKER_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: Build image from checked JAR
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
      - name: Check container exit codes before publishing
        run: bash scripts/docker-test.sh "$IMAGE"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish checked image
        run: docker push "$IMAGE"
      - name: Create release with artifact and image link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Commit: %s\n\nDocker Hub: https://hub.docker.com/r/%s\n\nImage: `%s`\n' "$GITHUB_SHA" "$DOCKER_REPOSITORY" "$IMAGE" > out/release-notes.txt
          gh release create "$RELEASE_TAG" out/release/kotlinbaza.tar.gz --target "$GITHUB_SHA" --title "KotlinBaza $RELEASE_TAG" --notes-file out/release-notes.txt
  notify:
    if: always()
    needs: [checks, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/notify-telegram.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_RESULT: CD checks=${{ needs.checks.result }}, publish=${{ needs.publish.result }}
